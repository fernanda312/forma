.chks{display:flex;flex-wrap:wrap;gap:8px}

.bcard{border:1px solid #2E2820;padding:18px;margin-bottom:14px;background:#221C15}
.bcard h3{font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14px}

.casehero{grid-template-columns:1fr}

.grid3{grid-template-columns:1fr 1fr}
.vals{grid-template-columns:1fr}
body{background-attachment:scroll}
.servlist .pr{white-space:normal;text-align:right}
.servlist b{min-width:0}
.next img{width:110px;height:74px;flex:0 0 110px}
.stats{grid-template-columns:1fr 1fr}
.servview div{flex-direction:column}
.servview b{flex:none}
}
</style>
</head>

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let PROJECTS=load('forma_projects',PROJECTS_DEFAULT);
PROJECTS.forEach(p=>{if(!p.own||!p.own.length)p.own=[p.gal]});
let SERVICES=load('forma_services',[
{title:'direção criativa',desc:'Conceito, história e direção visual de projetos e campanhas.',price:'a partir de 85.000 MT'},
{title:'design de marca',desc:'Identidade completa: nome, logótipo, cores, tipografia e manual.',price:'a partir de 120.000 MT'},
{title:'design digital e ui',desc:'Sites e aplicações com desenho limpo e foco em conversão.',price:'a partir de 95.000 MT'},
{title:'fotografia',desc:'Editorial, produto, arquitetura e retrato, com direção de arte.',price:'a partir de 45.000 MT'},
{title:'vídeo e motion',desc:'Filmes de marca, campanhas e motion design.',price:'a partir de 75.000 MT'},
{title:'campanhas',desc:'Campanhas completas, do conceito à entrega em todos os formatos.',price:'a partir de 150.000 MT'}]);
let EDIT_S=null;
let ACCOUNTS=load('forma_accounts',[]);
let SESSION=load('forma_session',null);
let SETTINGS=load('forma_settings',{whatsapp:'258840000000',email:'ola@forma.co.mz'});
let ABOUT=load('forma_about',{intro:'A FORMA é um estúdio criativo de Maputo. Trabalhamos imagem, marca e espaço para clientes que querem ser lembrados — não apenas vistos.',vals:[['empatia','Antes de desenhar, ouvimos. O trabalho começa na pessoa, não no briefing.'],['liberdade','Sem fórmulas. Cada projeto encontra a sua própria forma.'],['crescimento','O estúdio cresce com os clientes, projeto a projeto.']]});
let CURCASE=null, ADMIN_TAB='projetos', CTAB='cliente', EDIT_P=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function me(){return SESSION?ACCOUNTS.find(a=>a.email===SESSION):null}
function isAdmin(){const m=me();return m&&m.is_admin}
function toggleMenu(){$('menuov').classList.toggle('on')}
function tickClock(){try{$('localTime').textContent=new Intl.DateTimeFormat('pt-MZ',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Maputo'}).format(new Date())}catch(e){}}
function waChat(){window.open('https://wa.me/'+SETTINGS.whatsapp.replace(/\D/g,''),'_blank')}
function renderServicos(){$('servView').innerHTML=SERVICES.map((s,i)=>`<div><b>0${i+1}. ${esc(s.title)}</b><p>${esc(s.desc)}</p><span class="pr">${esc(s.price)}</span></div>`).join('')}
function renderHome(){$('strip').innerHTML=`<div class="striptrack">${[...PROJECTS,...PROJECTS].map(p=>`<button class="pcard" onclick="openCase('${p.id}')"><img src="${p.img}" alt=""><span>${esc(p.title)}<small>${esc(p.client)} · ${p.year}</small></span></button>`).join('')}</div>`;setTimeout(typePhrase,900)}
const PHRASE='FORMA é um estúdio criativo de Maputo — design, marca, fotografia e vídeo para marcas que querem ser lembradas.';
function typePhrase(){const el=document.getElementById('phrasetext');if(!el)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=PHRASE;return}el.textContent='';let i=0;clearInterval(window._tp);window._tp=setInterval(()=>{i++;el.textContent=PHRASE.slice(0,i);if(i>=PHRASE.length)clearInterval(window._tp)},38)}
function openCase(id){CURCASE=id;go('caso')}
function renderCase(){
const p=PROJECTS.find(x=>x.id===CURCASE);if(!p){go('inicio');return}
const idx=PROJECTS.findIndex(x=>x.id===p.id);
const nx=PROJECTS[(idx+1)%PROJECTS.length];
const own=(p.own&&p.own.length)?p.own:[p.gal];
const gal=own.slice(1);
$('caseBox').innerHTML=`<div class="casehero"><div class="left"><span class="tag">FORMA — Estúdio criativo</span><h1>${esc(p.title)}</h1><div class="meta"><span>${esc(p.client)} / ${p.year}</span><span>${esc(p.services)}</span><span>projeto ${idx+1} de ${PROJECTS.length}</span></div></div><div class="right"><img src="${own[0]}"></div></div>
<p class="intro">${esc(p.intro)}</p>
${gal.length?`<div class="numsec"><div class="lab">galeria do tema</div>${gal.map(src=>`<img src="${src}" style="margin-bottom:2px">`).join('')}</div>`:''}
<div class="numsec"><div class="lab">resultado</div><p style="font-size:19px;line-height:1.6;max-width:720px">${esc(p.result||'')}</p></div>
<div class="next" onclick="openCase('${nx.id}')"><h2>next project<br>${esc(nx.title)}</h2><span class="btnw">→</span></div>`;
}
function renderArquivo(){$('grid3').innerHTML=PROJECTS.map(p=>{const own=(p.own&&p.own.length)?p.own:[p.gal];return own.map(src=>`<button onclick="openCase('${p.id}')"><img src="${src}"><span>${esc(p.title)}</span></button>`).join('')}).join('')}
function renderSobre(){
$('aboutBox').innerHTML=`<h1>sobre</h1><section class="manifesto" style="padding-top:20px"><h2>não fazemos design bonito.<br>fazemos marcas que ficam.</h2></section><p style="font-size:20px;line-height:1.5;max-width:800px">${esc(ABOUT.intro)}</p><div class="stats"><div><b>40+</b><span>projetos entregues</span></div><div><b>25</b><span>clientes</span></div><div><b>12</b><span>anos de estúdio</span></div><div><b>03</b><span>cidades</span></div></div>
<div class="vals">${ABOUT.vals.map((v,i)=>`<div><b>0${i+1}. ${esc(v[0])}</b><p>${esc(v[1])}</p></div>`).join('')}</div>
<h2 style="font-size:30px;margin:20px 0">processo</h2>
<div class="steps">${[['ver','Olhamos para o problema com calma, antes de qualquer ideia.'],['explorar','Caminhos abertos, referências e testes, sem pressa de fechar.'],['moldar','Definimos tom, história e lógica visual do projeto.'],['criar','A ideia ganha forma final, com rigor em cada detalhe.'],['refinar','Ajustamos até o trabalho ficar exato.'],['evoluir','O projeto continua a crescer depois da entrega.']].map((s,i)=>`<div><b>0${i+1}</b><p><b style="color:#ECE4D4">${s[0]}</b> — ${s[1]}</p></div>`).join('')}</div>`;
}
function tabContacto(t){CTAB=t;['Cliente','Talento','Email'].forEach(n=>$('tab'+n).classList.toggle('on',n.toLowerCase()===t));renderBrief()}
function renderBrief(){
if(CTAB==='email'){$('briefBox').innerHTML=`<p style="font-size:18px;line-height:1.6">Escreve-nos para <b>${esc(SETTINGS.email)}</b> ou fala connosco já no WhatsApp.</p><button class="send" onclick="waChat()">WhatsApp →</button>`;return}
if(CTAB==='talento'){$('briefBox').innerHTML=`<p style="font-size:18px;line-height:1.6;margin-bottom:10px">Junta-te à nossa rede de talento.</p>
<label>01. Área</label><div class="chks">${['Design gráfico','Fotografia','Vídeo','Ilustração','Design de interiores','Produção'].map(s=>`<label><input type="checkbox"> ${s}</label>`).join('')}</div>
<label>02. Nível</label><div class="chks">${['Júnior','Intermédio','Sénior','Diretor'].map(s=>`<label><input type="radio" name="lvl"> ${s}</label>`).join('')}</div>
<label>03. Nome</label><input id="bName"><label>04. Email</label><input id="bEmail" type="email"><label>05. Portfólio (link)</label><input id="bPort"><label>06. Cidade</label><input id="bCity">
<button class="send" onclick="submitBrief()">Send →</button><div id="briefOk"></div>`;return}
$('briefBox').innerHTML=`<label>01. Âmbito</label><div class="chks">${['Direção criativa','Design de marca','Design digital e UI','Fotografia','Vídeo e motion','Campanhas','Design de interiores','Não sei ainda'].map(s=>`<label><input type="checkbox"> ${s}</label>`).join('')}</div>
<label>02. Formato</label><div class="chks">${['Projeto','Freelance','Avença'].map(s=>`<label><input type="radio" name="fmt"> ${s}</label>`).join('')}</div>
<label>03. Orçamento</label><div class="chks">${['50.000–100.000 MT','100.000–200.000 MT','200.000–500.000 MT','500.000+ MT','Vamos conversar primeiro'].map(s=>`<label><input type="radio" name="bud"> ${s}</label>`).join('')}</div>
<label>04. Nome *</label><input id="bName"><label>05. Email *</label><input id="bEmail" type="email"><label>06. Empresa</label><input id="bCompany"><label>07. Prazo</label><input id="bTime"><label>08. Nota</label><textarea id="bNote"></textarea>
<button class="send" onclick="submitBrief()">Send →</button><div id="briefOk"></div>`;
}
function submitBrief(){const n=$('bName')&&$('bName').value.trim(),e=$('bEmail')&&$('bEmail').value.trim();if(!n||!e||!e.includes('@')){alert('Escreve o nome e um email válido.');return}$('briefOk').innerHTML='<p style="margin-top:16px;font-weight:700">Obrigado! Respondemos em 48 horas.</p><button class="send" onclick="waChat()">Ou fala já no WhatsApp →</button>';}
function renderConta(){
const m=me();
if(!m){$('accBox').innerHTML=`<div style="max-width:420px"><label style="display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Email</label><input id="aEmail" type="email" style="margin-bottom:12px"><label style="display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Palavra-passe</label><input id="aPass" type="password" style="margin-bottom:12px"><label style="display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Nome</label><input id="aName" placeholder="só no registo" style="margin-bottom:16px"><button class="btn" onclick="loginSubmit()">Entrar</button> <button class="btnw" onclick="regSubmit()">Criar conta</button><p class="mut" style="margin-top:12px">A primeira conta criada é a da gerência.</p></div>`;return}
$('accBox').innerHTML=`<div class="bcard"><b>${esc(m.name||m.email)}</b><div class="mut">${esc(m.email)}</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${m.is_admin?`<button class="btn" onclick="go('admin')">Gerência</button>`:''}<button class="btnw" onclick="logout()">Sair</button></div></div>`;
}
async function loginSubmit(){const e=$('aEmail').value.trim().toLowerCase(),p=$('aPass').value;const a=ACCOUNTS.find(x=>x.email===e);if(!a||a.pass!==await sha(p)){alert('Email ou palavra-passe errados.');return}SESSION=e;save('forma_session',SESSION);go('inicio')}
async function regSubmit(){const e=$('aEmail').value.trim().toLowerCase(),p=$('aPass').value,n=$('aName').value.trim();if(!e.includes('@')||p.length<4){alert('Escreve um email válido e uma palavra-passe com 4 ou mais caracteres.');return}if(ACCOUNTS.find(x=>x.email===e)){alert('Já existe uma conta com esse email. Entra em vez disso.');return}ACCOUNTS.push({email:e,pass:await sha(p),name:n||e,is_admin:ACCOUNTS.length===0});save('forma_accounts',ACCOUNTS);SESSION=e;save('forma_session',SESSION);go('inicio')}
function logout(){SESSION=null;save('forma_session',SESSION);go('inicio')}

function adminNavRender(){$('adminNav').innerHTML=[['projetos','Projetos'],['servicos','Serviços'],['sobre','Sobre'],['definicoes','Definições']].map(t=>`<button class="${ADMIN_TAB===t[0]?'on':''}" onclick="adminTab('${t[0]}')">${t[1]}</button>`).join('')}
function adminTab(t){ADMIN_TAB=t;renderAdmin()}
function renderAdmin(){
if(!isAdmin()){$('adminBox').innerHTML='<p class="mut">Área reservada à gerência.</p>';return}
adminNavRender();
if(ADMIN_TAB==='projetos'){
$('adminBox').innerHTML=`<table><tr><th>Projeto</th><th>Cliente</th><th>Ano</th><th></th></tr>${PROJECTS.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.client)}</td><td>${p.year}</td><td><button onclick="projEdit('${p.id}')">Editar</button> <button onclick="projDel('${p.id}')">Apagar</button></td></tr>`).join('')}</table>
<div class="bcard" style="margin-top:16px"><b id="projFormTitle">Novo projeto</b><div style="display:grid;gap:10px;margin-top:12px"><input id="fPTitle" placeholder="Título em minúsculas"><input id="fPClient" placeholder="Cliente"><input id="fPYear" type="number" placeholder="Ano"><input id="fPServ" placeholder="Serviços"><textarea id="fPIntro" placeholder="Texto de introdução"></textarea><input id="fPResult" placeholder="Resultado (ex: Série entregue em 40 imagens finais)"><label>Foto principal (por ficheiro)</label><input type="file" id="fPPhoto" accept="image/*" onchange="projPhoto(this,'main')"><input type="hidden" id="fPImg"><label>Foto da galeria (por ficheiro)</label><input type="file" id="fPGPhoto" accept="image/*" onchange="projPhoto(this,'gal')"><input type="hidden" id="fPGal"><label>Foto do tema 2 (por ficheiro)</label><input type="file" id="fPOwn1" accept="image/*" onchange="projPhoto(this,'own1')"><input type="hidden" id="fPOwn1v"><label>Foto do tema 3 (por ficheiro)</label><input type="file" id="fPOwn2" accept="image/*" onchange="projPhoto(this,'own2')"><input type="hidden" id="fPOwn2v"><button class="btn" onclick="projSave()">Guardar projeto</button></div></div>`;
}else if(ADMIN_TAB==='servicos'){
$('adminBox').innerHTML=`<table><tr><th>Serviço</th><th>Preço</th><th></th></tr>${SERVICES.map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${esc(s.price)}</td><td><button onclick="servEdit(${i})">Editar</button> <button onclick="servDel(${i})">Apagar</button></td></tr>`).join('')}</table>
<div class="bcard" style="margin-top:16px"><b id="servFormTitle">Novo serviço</b><div style="display:grid;gap:10px;margin-top:12px"><input id="fSTitle" placeholder="Título em minúsculas"><textarea id="fSDesc" placeholder="Descrição"></textarea><input id="fSPrice" placeholder="Preço (ex: a partir de 85.000 MT)"><button class="btn" onclick="servSave()">Guardar serviço</button></div></div>`;
}else if(ADMIN_TAB==='sobre'){
$('adminBox').innerHTML=`<div class="bcard" style="display:grid;gap:10px;max-width:640px"><b>Sobre o estúdio</b><label>Introdução</label><textarea id="fAbout">${esc(ABOUT.intro)}</textarea><button class="btn" onclick="saveAbout()">Guardar</button></div>`;
}else{
$('adminBox').innerHTML=`<div class="bcard" style="display:grid;gap:10px;max-width:520px"><b>Definições</b><label>WhatsApp (ex: 25884…)</label><input id="fWa" value="${esc(SETTINGS.whatsapp)}"><label>Email de contacto</label><input id="fEmail" value="${esc(SETTINGS.email)}"><button class="btn" onclick="saveSettings()">Guardar definições</button></div>`;
}
}
function projPhoto(inp,which){const f=inp.files[0];if(!f)return;if(f.size>10*1024*1024){alert('A foto deve ter até 10 MB.');return}const r=new FileReader();r.onload=()=>{$(which==='main'?'fPImg':which==='own1'?'fPOwn1v':which==='own2'?'fPOwn2v':'fPGal').value=r.result;alert('Foto carregada. Guarda o projeto para aplicar.');};r.readAsDataURL(f)}
function projEdit(id){const p=PROJECTS.find(x=>x.id===id);if(!p)return;EDIT_P=id;renderAdmin();$('projFormTitle').textContent='Editar projeto';$('fPTitle').value=p.title;$('fPClient').value=p.client;$('fPYear').value=p.year;$('fPServ').value=p.services;$('fPIntro').value=p.intro;$('fPResult').value=p.result||'';$('fPImg').value=p.img;$('fPGal').value=p.gal;$('fPOwn1v').value=(p.own&&p.own[1])||'';$('fPOwn2v').value=(p.own&&p.own[2])||'';window.scrollTo(0,document.body.scrollHeight)}
function projSave(){const title=$('fPTitle').value.trim().toLowerCase(),client=$('fPClient').value.trim(),year=+($('fPYear').value)||new Date().getFullYear(),serv=$('fPServ').value.trim(),intro=$('fPIntro').value.trim(),result=$('fPResult').value.trim(),img=$('fPImg').value,gal=$('fPGal').value,o1=$('fPOwn1v').value,o2=$('fPOwn2v').value;if(!title){alert('Escreve o título do projeto.');return}if(EDIT_P){const p=PROJECTS.find(x=>x.id===EDIT_P);const ownNew=[gal||p.gal];if(o1)ownNew.push(o1);if(o2)ownNew.push(o2);Object.assign(p,{title,client:client||p.client,year,services:serv||p.services,intro:intro||p.intro,result:result||p.result,img:img||p.img,gal:gal||p.gal,own:ownNew});}else{PROJECTS.push(P('p'+Date.now(),title,client||'Projeto',year,serv||'Direção criativa',img||IMG.f1,gal||IMG.f2,intro||title,result||'Entrega final com acompanhamento.',[gal||IMG.f2,o1,o2].filter(Boolean)));}EDIT_P=null;save('forma_projects',PROJECTS);renderHome();renderAdmin();alert('Projeto guardado.')}
function projDel(id){if(!confirm('Apagar este projeto?'))return;PROJECTS=PROJECTS.filter(p=>p.id!==id);save('forma_projects',PROJECTS);renderHome();renderAdmin()}
function servEdit(i){const s=SERVICES[i];EDIT_S=i;renderAdmin();$('servFormTitle').textContent='Editar serviço';$('fSTitle').value=s.title;$('fSDesc').value=s.desc;$('fSPrice').value=s.price}
function servSave(){const t=$('fSTitle').value.trim().toLowerCase(),d=$('fSDesc').value.trim(),pr=$('fSPrice').value.trim();if(!t){alert('Escreve o título do serviço.');return}if(EDIT_S!==null){SERVICES[EDIT_S]={title:t,desc:d,price:pr}}else{SERVICES.push({title:t,desc:d,price:pr})}EDIT_S=null;save('forma_services',SERVICES);renderHome();renderAdmin();alert('Serviço guardado.')}
function servDel(i){if(!confirm('Apagar este serviço?'))return;SERVICES.splice(i,1);save('forma_services',SERVICES);renderHome();renderAdmin()}
function saveAbout(){ABOUT.intro=$('fAbout').value.trim();save('forma_about',ABOUT);alert('Texto guardado.')}
function saveSettings(){SETTINGS.whatsapp=$('fWa').value.trim();SETTINGS.email=$('fEmail').value.trim();save('forma_settings',SETTINGS);alert('Definições guardadas.')}
function go(v){
document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
const el=$('v-'+v);if(el)el.classList.add('on');
if(v==='inicio')renderHome();
if(v==='caso')renderCase();
if(v==='arquivo')renderArquivo();
if(v==='sobre')renderSobre();
if(v==='servicos')renderServicos();
if(v==='contacto'){tabContacto(CTAB)}
if(v==='conta')renderConta();
if(v==='admin')renderAdmin();
window.scrollTo(0,0);
}
function route(){const h=(location.hash||'#inicio').replace('#','');const parts=h.split('/');if(parts[0]==='caso'&&parts[1]){CURCASE=parts[1];go('caso')}else if(['inicio','arquivo','sobre','servicos','contacto','conta','admin'].includes(parts[0]))go(parts[0]);else go('inicio')}
window.addEventListener('hashchange',route);
tickClock();setInterval(tickClock,30000);
route();renderHome();
</script>
</body>
</html>
