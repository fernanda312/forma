<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:#ECE4D4;background-color:#16130F;background-image:linear-gradient(rgba(22,19,15,.72),rgba(22,19,15,.92)),url('https://i.pinimg.com/1200x/a4/ad/a0/a4ada062e81e346c168adf2a9c314417.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;overflow-x:hidden}
body.home{background-color:#0B0906;background-image:linear-gradient(rgba(10,8,5,.30),rgba(10,8,5,.30)),url('images/fundo-inicial.jpg');background-size:cover,contain;background-position:center,center;background-repeat:no-repeat,no-repeat}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:12px;border:1px solid #3A332A;background:#221C15;color:#ECE4D4;width:100%;border-radius:0}
::placeholder{color:#9A8F7A}
h1,h2,h3{text-transform:lowercase;letter-spacing:-.02em;font-family:'Fraunces',serif;font-weight:700}

p{font-weight:300}
#intro{position:fixed;inset:0;background:#16130F;z-index:100;display:flex;align-items:center;justify-content:center;animation:introfade 1.6s ease .9s forwards;pointer-events:none}

.hdr{position:fixed;top:0;left:0;right:0;background:#16130F;display:flex;align-items:center;gap:18px;padding:18px 20px;border-bottom:1px solid #2E2820;z-index:50}
.logo{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;line-height:1.5}
.logo small{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;color:#9A8F7A}
.hdr .sp{flex:1}
.hbtn{background:#221C15;border:1px solid #ECE4D4;color:#ECE4D4;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:9px 14px}
.hstack{display:flex;flex-direction:column;gap:8px}
.clock{font-size:12px;font-weight:700;letter-spacing:.12em;text-align:right}
.clock small{display:block;font-size:9px;color:#9A8F7A;letter-spacing:.18em}
.dot{width:14px;height:14px;border:1px solid #ECE4D4;border-radius:50%;flex:0 0 14px}
main{max-width:1400px;margin:0 auto;padding:122px 20px 40px}
.view{display:none}
.view.on{display:block}
#v-inicio.on{display:flex;flex-direction:column;justify-content:center;min-height:calc(100vh - 162px)}
.homephrase{font-family:'Courier Prime',monospace;font-weight:400;font-size:clamp(17px,2.4vw,26px);line-height:1.5;text-align:center;max-width:760px;margin:0 auto 26px;padding:0 10px;cursor:pointer}
.homephrase .caret{display:inline-block;width:2px;height:1em;background:#ECE4D4;margin-left:4px;vertical-align:-0.12em;animation:blink 1s step-end infinite}

.strip{overflow:hidden;padding-bottom:6px}
.striptrack{display:flex;gap:2px;width:max-content;animation:stripscroll 32s linear infinite}

.pcard{position:relative;flex:0 0 420px;height:300px;border:0;background:#221C15;padding:0;overflow:hidden;text-align:left}
.pcard img{width:100%;height:100%;object-fit:contain;background:#221C15}
.pcard span{position:absolute;left:16px;bottom:14px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#ECE4D4;background:#16130F;padding:8px 10px}
.pcard small{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;color:#C9BFA8;margin-top:4px}
.casehero{display:grid;grid-template-columns:1fr 1fr;min-height:70vh;border-bottom:1px solid #2E2820}
.casehero .left{padding:40px 30px 30px 0;display:flex;flex-direction:column}
.casehero .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C9BFA8}
.casehero h1{font-size:clamp(48px,7vw,110px);font-weight:800;line-height:.95;margin-top:22px}
.casehero .meta{margin-top:auto;display:flex;gap:30px;flex-wrap:wrap;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C9BFA8;padding-top:30px}
.casehero .right img{width:100%;height:100%;object-fit:contain;background:#221C15;display:block}
.intro{font-size:clamp(20px,2.6vw,30px);line-height:1.4;padding:50px 0;max-width:900px}
.numsec{padding:44px 0;border-top:1px solid #2E2820}

.next{display:flex;align-items:center;gap:20px;border-top:1px solid #2E2820;padding:40px 0;cursor:pointer}

.grid3 img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#221C15;display:block}
.about h1{font-size:clamp(44px,7vw,100px);font-weight:800;line-height:.95;margin:30px 0}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:30px 0}
.vals div{background:#221C15;padding:26px}
.vals b{font-size:26px;display:block;margin-bottom:10px}
.vals p{color:#C9BFA8;line-height:1.6;font-size:15px}
.steps{margin:30px 0}
.steps div{display:flex;gap:20px;padding:20px 0;border-top:1px solid #2E2820}
.steps b{font-size:15px;color:#9A8F7A;flex:0 0 40px}
.steps p{line-height:1.6;color:#C9BFA8}
.contact{background:#7E8C6F;color:#39412F;min-height:calc(100vh - 122px);padding:30px 20px;margin:0 -20px}
.contact h1{font-size:clamp(44px,8vw,110px);font-weight:800;line-height:.95}
.contact .sub{margin:14px 0 26px;font-size:17px}
.tabs{display:flex;gap:22px;margin-bottom:26px}
.tabs button{background:transparent;border:1.5px solid #39412F;color:#39412F;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:10px 16px}
.tabs button.on{background:#39412F;color:#ECE4D4}
.contact input,.contact textarea,.contact select{background:#fff;color:#222;border:1px solid #39412F}
.contact label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin:16px 0 6px}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{margin:0;text-transform:none;letter-spacing:0;font-weight:600;display:flex;align-items:center;gap:6px;border:1px solid #39412F;padding:8px 12px;cursor:pointer}
.chks input{width:auto}
.send{background:#39412F;border:2px solid #39412F;color:#ECE4D4;font-size:18px;font-weight:800;padding:16px 26px;margin-top:24px;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.menuov{position:fixed;inset:0;background:#0E0C09;z-index:80;display:none;flex-direction:column;padding:22px}
.menuov.on{display:flex}
.menuov a{display:block;font-size:clamp(44px,9vw,96px);font-weight:800;text-transform:lowercase;letter-spacing:-.02em;color:#ECE4D4;text-decoration:none;padding:8px 0;cursor:pointer}
.menuov .mclose{align-self:flex-end;background:#221C15;border:1px solid #ECE4D4;color:#ECE4D4;font-size:26px;padding:6px 14px}
.menuov .mfoot{margin-top:auto;display:flex;gap:20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9A8F7A}
.menuov .mfoot a{font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:0}
.bcard{border:1px solid #2E2820;padding:18px;margin-bottom:14px;background:#221C15}
.bcard h3{font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14px}
table button{background:#221C15;color:#ECE4D4;border:1.5px solid #ECE4D4;padding:8px 14px;font-weight:700}
th,td{text-align:left;padding:10px;border-bottom:1px solid #2E2820;vertical-align:top}
.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.adminnav button{border:2px solid #3A332A;background:#221C15;color:#ECE4D4;padding:10px 18px;font-weight:700;border-radius:0;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.adminnav button.on{background:#ECE4D4;color:#16130F}
.btn{background:#ECE4D4;color:#16130F;border:2px solid #ECE4D4;padding:16px 26px;font-weight:700;font-size:15px;border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.btnw{background:#221C15;color:#ECE4D4;border:2px solid #ECE4D4;padding:14px 22px;font-weight:700;border-radius:0;box-shadow:4px 4px 0 rgba(0,0,0,.45)}
.mut{color:#9A8F7A;font-size:13px}
.manifesto{padding:90px 0 30px}

.seclab{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9A8F7A;margin:50px 0 6px}
.servlist div{display:flex;align-items:center;gap:18px;padding:22px 0;border-top:1px solid #2E2820;cursor:pointer}
.servlist b{font-size:clamp(22px,3.4vw,38px);font-weight:800;text-transform:lowercase}
.servlist .num{font-size:13px;color:#9A8F7A;flex:0 0 34px}

.servlist .ar{font-size:22px;color:#9A8F7A}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:50px 0}
.stats div{background:#221C15;padding:26px}
.stats b{font-size:34px;display:block}
.stats span{color:#9A8F7A;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.cta{padding:70px 0 40px}
.cta h2{font-size:clamp(40px,7vw,96px);font-weight:800;line-height:.98;margin-bottom:26px}
.foot{border-top:1px solid #2E2820;padding:50px 0 16px}
.wordmark{font-size:clamp(64px,18vw,250px);font-weight:800;line-height:.85;letter-spacing:-.04em;text-transform:lowercase}
.footcols{display:flex;gap:40px;flex-wrap:wrap;margin-top:30px;font-size:13px;line-height:2}
.footcols button{background:none;border:0;color:#C9BFA8;padding:0;font-size:13px;display:block;text-align:left}
.servview div{display:flex;gap:20px;padding:26px 0;border-top:1px solid #2E2820}
.servview b{font-size:clamp(22px,3.4vw,36px);font-weight:800;text-transform:lowercase;flex:0 0 34%;}
.servview p{color:#C9BFA8;line-height:1.6}
.servview .pr{font-size:13px;letter-spacing:.1em;color:#C9BFA8;white-space:nowrap}
@media(max-width:760px){
.hdr .hidem{display:none}
.casehero{grid-template-columns:1fr}
.casehero .right{order:-1}
.casehero .right img{height:auto}
.pcard{flex:0 0 300px;height:210px}
.grid3{grid-template-columns:1fr 1fr}
.vals{grid-template-columns:1fr}
body{background-attachment:scroll}
.servlist .pr{white-space:normal;text-align:right}
.servlist b{min-width:0}
.next img{width:110px;height:74px;flex:0 0 110px}
.stats{grid-template-columns:1fr 1fr}
.servview div{flex-direction:column}
.servview b{flex:none}
}
.chatwrap{margin:0 -20px;min-height:calc(100vh - 122px);background:#0E0C09;padding:20px;display:flex;flex-direction:column}
.chatmsgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px 0}
.msg{max-width:82%;padding:10px 12px;font-size:15px;line-height:1.5}
.msg img{max-width:100%;display:block}
.msg.mine{align-self:flex-end;background:#ECE4D4;color:#16130F}
.msg.theirs{align-self:flex-start;background:#221C15;color:#ECE4D4;border:1px solid #2E2820}
.msg .mt{font-size:11px;opacity:.65;margin-top:6px}
.chatin{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chatin input[type=text]{flex:1;min-width:180px}
.convbtn{display:block;width:100%;text-align:left;background:#221C15;border:1px solid #2E2820;color:#ECE4D4;padding:12px;margin-bottom:8px;font-size:15px}
</style>

function openCase(id){CURCASE=id;go('caso')}

const nx=PROJECTS[(idx+1)%PROJECTS.length];
const own=(p.own&&p.own.length)?p.own:[p.gal];
const gal=own.slice(1);
$('caseBox').innerHTML=`<div class="casehero"><div class="left"><span class="tag">FORMA — Estúdio criativo</span><h1>${esc(p.title)}</h1><div class="meta"><span>${esc(p.client)} / ${p.year}</span><span>${esc(p.services)}</span><span>projeto ${idx+1} de ${PROJECTS.length}</span></div></div><div class="right"><img src="${own[0]}"></div></div>
<p class="intro">${esc(p.intro)}</p>

function renderArquivo(){$('grid3').innerHTML=PROJECTS.map(p=>{const own=(p.own&&p.own.length)?p.own:[p.gal];return own.map(src=>`<button onclick="openCase('${p.id}')"><img loading="lazy" src="${src}"><span>${esc(p.title)}</span></button>`).join('')}).join('')}
function renderSobre(){

<div class="vals">${ABOUT.vals.map((v,i)=>`<div><b>0${i+1}. ${esc(v[0])}</b><p>${esc(v[1])}</p></div>`).join('')}</div>
<h2 style="font-size:30px;margin:20px 0">processo</h2>
<div class="steps">${[['ver','Olhamos para o problema com calma, antes de qualquer ideia.'],['explorar','Caminhos abertos, referências e testes, sem pressa de fechar.'],['moldar','Definimos tom, história e lógica visual do projeto.'],['criar','A ideia ganha forma final, com rigor em cada detalhe.'],['refinar','Ajustamos até o trabalho ficar exato.'],['evoluir','O projeto continua a crescer depois da entrega.']].map((s,i)=>`<div><b>0${i+1}</b><p><b style="color:#ECE4D4">${s[0]}</b> — ${s[1]}</p></div>`).join('')}</div>`;

function submitBrief(){const n=$('bName')&&$('bName').value.trim(),e=$('bEmail')&&$('bEmail').value.trim();if(!n||!e||!e.includes('@')){alert('Escreve o nome e um email válido.');return}

async function loginSubmit(){const e=$('aEmail').value.trim().toLowerCase(),p=$('aPass').value;const a=ACCOUNTS.find(x=>x.email===e);if(!a||a.pass!==await sha(p)){alert('Email ou palavra-passe errados.');return}SESSION=e;save('forma_session',SESSION);go('inicio')}

<div class="bcard" style="margin-top:16px"><b id="projFormTitle">Novo projeto</b><div style="display:grid;gap:10px;margin-top:12px"><input id="fPTitle" placeholder="Título em minúsculas"><input id="fPClient" placeholder="Cliente"><input id="fPYear" type="number" placeholder="Ano"><input id="fPServ" placeholder="Serviços"><textarea id="fPIntro" placeholder="Texto de introdução"></textarea><input id="fPResult" placeholder="Resultado (ex: Série entregue em 40 imagens finais)"><label>Foto principal (por ficheiro)</label><input type="file" id="fPPhoto" accept="image/*" onchange="projPhoto(this,'main')"><input type="hidden" id="fPImg"><label>Foto da galeria (por ficheiro)</label><input type="file" id="fPGPhoto" accept="image/*" onchange="projPhoto(this,'gal')"><input type="hidden" id="fPGal"><label>Foto do tema 2 (por ficheiro)</label><input type="file" id="fPOwn1" accept="image/*" onchange="projPhoto(this,'own1')"><input type="hidden" id="fPOwn1v"><label>Foto do tema 3 (por ficheiro)</label><input type="file" id="fPOwn2" accept="image/*" onchange="projPhoto(this,'own2')"><input type="hidden" id="fPOwn2v"><button class="btn" onclick="projSave()">Guardar projeto</button></div></div>`;
}else if(ADMIN_TAB==='servicos'){
$('adminBox').innerHTML=`<table><tr><th>Serviço</th><th>Preço</th><th></th></tr>${SERVICES.map((s,i)=>`<tr><td>${esc(s.title)}</td><td>${esc(s.price)}</td><td><button onclick="servEdit(${i})">Editar</button> <button onclick="servDel(${i})">Apagar</button></td></tr>`).join('')}</table>
<div class="bcard" style="margin-top:16px"><b id="servFormTitle">Novo serviço</b><div style="display:grid;gap:10px;margin-top:12px"><input id="fSTitle" placeholder="Título em minúsculas"><textarea id="fSDesc" placeholder="Descrição"></textarea><input id="fSPrice" placeholder="Preço (ex: a partir de 85.000 MT)"><button class="btn" onclick="servSave()">Guardar serviço</button></div></div>`;

$('adminBox').innerHTML=`<div class="bcard" style="display:grid;gap:10px;max-width:640px"><b>Sobre o estúdio</b><label>Introdução</label><textarea id="fAbout">${esc(ABOUT.intro)}</textarea><button class="btn" onclick="saveAbout()">Guardar</button></div>`;
}else if(ADMIN_TAB==='pedidos'){
$('adminBox').innerHTML=PEDIDOS.length?`<table><tr><th>Pedido</th><th>Contacto</th><th>Estado</th><th></th></tr>${PEDIDOS.map((r,i)=>`<tr><td><b>${esc(r.tipo)}</b> — ${esc(r.nome)}<br><span class="mut">${esc(((r.ambito||r.areas||[]).join(', ')))}${r.orcamento?' · '+esc(r.orcamento):''}${r.nota?' — '+esc(r.nota):''}</span></td><td>${esc(r.email)}<br><span class="mut">${new Date(r.data).toLocaleDateString('pt-MZ')}</span></td><td>${esc(r.estado)}</td><td><button onclick="pedidoEstado(${i})">${r.estado==='novo'?'Marcar tratado':'Reabrir'}</button> <button onclick="pedidoDel(${i})">Apagar</button></td></tr>`).join('')}</table>`:'<p class="mut">Ainda não há pedidos.</p>';
}else if(ADMIN_TAB==='conversas'){
const users=[...new Set(CHAT.filter(m=>m.from!=='gerência').map(m=>m.from))];
if(!CHAT_THREAD){$('adminBox').innerHTML=users.length?users.map(u=>{const th=CHAT.filter(m=>m.from===u||m.to===u);const last=th[th.length-1];const un=CHAT.filter(m=>m.from===u&&!m.seen).length;return `<button class="convbtn" onclick="CHAT_THREAD='${u}';renderAdmin()">${esc(u)}${un?` <b>(${un} novas)</b>`:''}<br><span class="mut">${esc(((last.text||'[ficheiro/áudio]').slice(0,60)))}</span></button>`}).join(''):'<p class="mut">Ainda não há conversas.</p>';}
else{const u=CHAT_THREAD;CHAT.forEach(m=>{if(m.from===u&&!m.seen)m.seen=true});save('forma_chat',CHAT);const th=CHAT.filter(m=>m.from===u||m.to===u);$('adminBox').innerHTML=`<button class="btnw" onclick="CHAT_THREAD=null;renderAdmin()">← Todas as conversas</button><div class="chatmsgs" style="margin-top:12px">${th.map(x=>msgHtml(x,x.from==='gerência')).join('')}</div><div class="chatin"><input type="text" id="admChatIn" placeholder="Escreve a resposta..."><button class="btn" onclick="adminChatSend()">Enviar</button></div>`;}

}else{
$('adminBox').innerHTML=`<div class="bcard" style="display:grid;gap:10px;max-width:520px"><b>Definições</b><label>WhatsApp (ex: 25884…)</label><input id="fWa" value="${esc(SETTINGS.whatsapp)}"><label>Email de contacto</label><input id="fEmail" value="${esc(SETTINGS.email)}"><button class="btn" onclick="saveSettings()">Guardar definições</button></div>`;
}

function projPhoto(inp,which){const f=inp.files[0];if(!f)return;if(f.size>10*1024*1024){alert('A foto deve ter até 10 MB.');return}const r=new FileReader();r.onload=()=>{$(which==='main'?'fPImg':which==='own1'?'fPOwn1v':which==='own2'?'fPOwn2v':'fPGal').value=r.result;alert('Foto carregada. Guarda o projeto para aplicar.');};r.readAsDataURL(f)}
function projEdit(id){const p=PROJECTS.find(x=>x.id===id);if(!p)return;EDIT_P=id;renderAdmin();$('projFormTitle').textContent='Editar projeto';$('fPTitle').value=p.title;$('fPClient').value=p.client;$('fPYear').value=p.year;$('fPServ').value=p.services;$('fPIntro').value=p.intro;$('fPResult').value=p.result||'';$('fPImg').value=p.img;$('fPGal').value=p.gal;$('fPOwn1v').value=(p.own&&p.own[1])||'';$('fPOwn2v').value=(p.own&&p.own[2])||'';window.scrollTo(0,document.body.scrollHeight)}
function projSave(){const title=$('fPTitle').value.trim().toLowerCase(),client=$('fPClient').value.trim(),year=+($('fPYear').value)||new Date().getFullYear(),serv=$('fPServ').value.trim(),intro=$('fPIntro').value.trim(),result=$('fPResult').value.trim(),img=$('fPImg').value,gal=$('fPGal').value,o1=$('fPOwn1v').value,o2=$('fPOwn2v').value;if(!title){alert('Escreve o título do projeto.');return}if(EDIT_P){const p=PROJECTS.find(x=>x.id===EDIT_P);const oldOwn=(p.own&&p.own.length)?p.own.slice():[p.gal];const ownNew=[gal||p.gal];for(let k=1;k<oldOwn.length;k++)ownNew.push(oldOwn[k]);if(o1)ownNew[1]=o1;if(o2)ownNew[2]=o2;Object.assign(p,{title,client:client||p.client,year,services:serv||p.services,intro:intro||p.intro,result:result||p.result,img:img||p.img,gal:gal||p.gal,own:ownNew});}else{PROJECTS.push(P('p'+Date.now(),title,client||'Projeto',year,serv||'Direção criativa',img||IMG.f1,gal||IMG.f2,intro||title,result||'Entrega final com acompanhamento.',[gal||IMG.f2,o1,o2].filter(Boolean)));}EDIT_P=null;save('forma_projects',PROJECTS);renderHome();renderAdmin();alert('Projeto guardado.')}
function projDel(id){if(!confirm('Apagar este projeto?'))return;PROJECTS=PROJECTS.filter(p=>p.id!==id);save('forma_projects',PROJECTS);renderHome();renderAdmin()}
function servEdit(i){const s=SERVICES[i];EDIT_S=i;renderAdmin();$('servFormTitle').textContent='Editar serviço';$('fSTitle').value=s.title;$('fSDesc').value=s.desc;$('fSPrice').value=s.price}
function servSave(){const t=$('fSTitle').value.trim().toLowerCase(),d=$('fSDesc').value.trim(),pr=$('fSPrice').value.trim();if(!t){alert('Escreve o título do serviço.');return}if(EDIT_S!==null){SERVICES[EDIT_S]={title:t,desc:d,price:pr}}else{SERVICES.push({title:t,desc:d,price:pr})}EDIT_S=null;save('forma_services',SERVICES);renderHome();renderAdmin();alert('Serviço guardado.')}
function servDel(i){if(!confirm('Apagar este serviço?'))return;SERVICES.splice(i,1);save('forma_services',SERVICES);renderHome();renderAdmin()}
function saveAbout(){ABOUT.intro=$('fAbout').value.trim();save('forma_about',ABOUT);alert('Texto guardado.')}
function saveSettings(){SETTINGS.whatsapp=$('fWa').value.trim();SETTINGS.email=$('fEmail').value.trim();save('forma_settings',SETTINGS);alert('Definições guardadas.')}

function msgHtml(m,mine){let body='';if(m.text)body+=`<div>${esc(m.text)}</div>`;if(m.file){if(m.file.startsWith('data:image'))body+=`<img src="${m.file}" style="max-width:100%">`;else if(m.file.startsWith('data:audio'))body+=`<audio controls src="${m.file}" style="width:100%"></audio>`;else body+=`<a href="${m.file}" download="${esc(m.fname||'ficheiro')}">📎 ${esc(m.fname||'ficheiro')}</a>`}if(m.audio)body+=`<audio controls src="${m.audio}" style="width:100%"></audio>`;return `<div class="msg ${mine?'mine':'theirs'}">${body}<div class="mt">${new Date(m.time).toLocaleString('pt-MZ',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} ${mine?(m.seen?'✓✓':'✓'):''}</div></div>`}
function renderChat(){
const m=me();
if(!m){$('chatBox').innerHTML=`<div class="chatwrap"><h1 style="font-size:clamp(40px,7vw,90px);font-weight:800">chat</h1><p style="font-size:18px;line-height:1.6">O chat é só para quem tem conta. Entra ou cria a tua conta para falares connosco.</p><button class="btn" onclick="go('conta')">Entrar / Criar conta</button></div>`;return}
CHAT.forEach(x=>{if(x.from==='gerência'&&x.to===m.email&&!x.seen)x.seen=true});save('forma_chat',CHAT);
const th=CHAT.filter(x=>x.from===m.email||x.to===m.email);
$('chatBox').innerHTML=`<div class="chatwrap"><h1 style="font-size:clamp(28px,5vw,54px);font-weight:800">chat — FORMA</h1><div class="mut" style="margin-bottom:8px">${esc(m.email)}</div><div class="chatmsgs">${th.map(x=>msgHtml(x,x.from===m.email)).join('')||'<p class="mut">Ainda não há mensagens. Escreve a primeira.</p>'}</div><div class="chatin"><input type="text" id="chatIn" placeholder="Escreve a tua mensagem..."><label class="btnw" style="cursor:pointer;padding:12px 16px">📎<input type="file" id="chatFile" accept="image/*,audio/*,.pdf" style="display:none" onchange="chatFilePicked(this)"></label><button class="btnw" id="recBtn" onclick="toggleRec()">● Gravar</button><button class="btn" onclick="chatSend()">Enviar</button></div></div>`;
}
function chatSend(){const m=me();if(!m)return;const inp=$('chatIn');const t=inp.value.trim();const f=$('chatFile');if(!t&&!(f&&f.files[0]))return;if(f&&f.files[0]){const fl=f.files[0];if(fl.size>5*1024*1024){alert('O ficheiro deve ter até 5 MB.');return}const r=new FileReader();r.onload=()=>{CHAT.push({id:Date.now(),from:m.email,to:'gerência',text:t,file:r.result,fname:fl.name,time:Date.now(),seen:false});save('forma_chat',CHAT);renderChat()};r.readAsDataURL(fl)}else{CHAT.push({id:Date.now(),from:m.email,to:'gerência',text:t,time:Date.now(),seen:false});save('forma_chat',CHAT);renderChat()}}
function chatFilePicked(inp){if(inp.files[0])alert('Ficheiro pronto: '+inp.files[0].name+'. Carrega em Enviar.')}
async function toggleRec(){const btn=$('recBtn');if(REC){REC.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});REC_CHUNKS=[];REC=new MediaRecorder(stream);REC.ondataavailable=e=>{if(e.data.size)REC_CHUNKS.push(e.data)};REC.onstop=()=>{const blob=new Blob(REC_CHUNKS,{type:'audio/webm'});const r=new FileReader();r.onload=()=>{const m=me();if(m){CHAT.push({id:Date.now(),from:m.email,to:'gerência',audio:r.result,time:Date.now(),seen:false});save('forma_chat',CHAT);renderChat()}};r.readAsDataURL(blob);REC=null;btn.textContent='● Gravar'};REC.start();btn.textContent='■ Parar'}catch(e){alert('Não foi possível aceder ao microfone.')}} 
function adminChatSend(){const t=$('admChatIn').value.trim();if(!t||!CHAT_THREAD)return;CHAT.push({id:Date.now(),from:'gerência',to:CHAT_THREAD,text:t,time:Date.now(),seen:false});save('forma_chat',CHAT);renderAdmin()}
function pedidoEstado(i){PEDIDOS[i].estado=PEDIDOS[i].estado==='novo'?'tratado':'novo';save('forma_pedidos',PEDIDOS);renderAdmin()}
function pedidoDel(i){if(!confirm('Apagar este pedido?'))return;PEDIDOS.splice(i,1);save('forma_pedidos',PEDIDOS);renderAdmin()}
function go(v){

const el=$('v-'+v);if(el)el.classList.add('on');
