<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORMA — Estúdio criativo, Maputo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:#ECE4D4;background:#16130F}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:12px;border:1px solid #3A332A;background:#221C15;color:#ECE4D4;width:100%;border-radius:0}
::placeholder{color:#9A8F7A}
h1,h2,h3{text-transform:lowercase;letter-spacing:-.02em}
#intro{position:fixed;inset:0;background:#16130F;z-index:100;display:flex;align-items:center;justify-content:center;animation:introfade 1.6s ease .9s forwards;pointer-events:none}
#intro span{font-size:clamp(64px,16vw,200px);font-weight:800;text-transform:lowercase;letter-spacing:-.04em}
@keyframes introfade{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#intro{display:none}}
.hdr{position:fixed;top:0;left:0;right:0;background:#16130F;display:flex;align-items:center;gap:18px;padding:18px 20px;border-bottom:1px solid #2E2820;z-index:50}
.logo{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;line-height:1.5}
.logo small{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;color:#9A8F7A}
.hdr .sp{flex:1}
.hbtn{background:none;border:0;color:#ECE4D4;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.hstack{display:flex;flex-direction:column;gap:8px}
.clock{font-size:12px;font-weight:700;letter-spacing:.12em;text-align:right}
.clock small{display:block;font-size:9px;color:#9A8F7A;letter-spacing:.18em}
.dot{width:14px;height:14px;border:1px solid #ECE4D4;border-radius:50%;flex:0 0 14px}
main{max-width:1400px;margin:0 auto;padding:86px 20px 40px}
.view{display:none}
.view.on{display:block}
.strip{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.pcard{position:relative;flex:0 0 420px;height:300px;border:0;background:#221C15;padding:0;scroll-snap-align:start;overflow:hidden;text-align:left}
.pcard img{width:100%;height:100%;object-fit:contain;background:#221C15}
.pcard span{position:absolute;left:16px;bottom:14px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#ECE4D4;text-shadow:0 1px 10px #000}
.pcard small{display:block;font-size:10px;font-weight:600;letter-spacing:.18em;color:#C9BFA8;margin-top:4px}
.casehero{display:grid;grid-template-columns:1fr 1fr;min-height:70vh;border-bottom:1px solid #2E2820}
.casehero .left{padding:40px 30px 30px 0;display:flex;flex-direction:column}
.casehero .tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9A8F7A}
.casehero h1{font-size:clamp(48px,7vw,110px);font-weight:800;line-height:.95;margin-top:22px}
.casehero .meta{margin-top:auto;display:flex;gap:30px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9A8F7A;padding-top:30px}
.casehero .right img{width:100%;height:100%;object-fit:contain;background:#221C15;display:block}
.intro{font-size:clamp(20px,2.6vw,30px);line-height:1.4;padding:50px 0;max-width:900px}
.numsec{padding:44px 0;border-top:1px solid #2E2820}
.numsec .lab{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9A8F7A;margin-bottom:18px}
.numsec img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#221C15;display:block}
.next{display:flex;align-items:center;gap:20px;border-top:1px solid #2E2820;padding:40px 0;cursor:pointer}
.next h2{font-size:clamp(40px,8vw,110px);font-weight:800;line-height:.95}
.next img{width:180px;height:120px;object-fit:contain;background:#221C15;flex:0 0 180px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid3 button{border:0;background:#221C15;padding:0;overflow:hidden}
.grid3 img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#221C15;display:block}
.about h1{font-size:clamp(44px,7vw,100px);font-weight:800;line-height:.95;margin:30px 0}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:30px 0}
.vals div{background:#221C15;padding:26px}
.vals b{font-size:26px;display:block;margin-bottom:10px}
.vals p{color:#C9BFA8;line-height:1.6;font-size:15px}
.steps{margin:30px 0}
.steps div{display:flex;gap:20px;padding:20px 0;border-top:1px solid #2E2820}
.steps b{font-size:15px;color:#9A8F7A;flex:0 0 40px}
.steps p{line-height:1.6;color:#C9BFA8}
.contact{background:#7E8C6F;color:#39412F;min-height:calc(100vh - 86px);padding:30px 20px;margin:0 -20px}
.contact h1{font-size:clamp(44px,8vw,110px);font-weight:800;line-height:.95}
.contact .sub{margin:14px 0 26px;font-size:17px}
.tabs{display:flex;gap:22px;margin-bottom:26px}
.tabs button{background:none;border:0;color:#39412F;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding-bottom:6px}
.tabs button.on{border-bottom:2px solid #39412F}
.contact input,.contact textarea,.contact select{background:#fff;color:#222;border:1px solid #39412F}
.contact label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin:16px 0 6px}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{margin:0;text-transform:none;letter-spacing:0;font-weight:600;display:flex;align-items:center;gap:6px;border:1px solid #39412F;padding:8px 12px;cursor:pointer}
.chks input{width:auto}
.send{background:none;border:0;border-bottom:2px solid #39412F;color:#39412F;font-size:18px;font-weight:800;padding:6px 2px;margin-top:24px}
.menuov{position:fixed;inset:0;background:#0E0C09;z-index:80;display:none;flex-direction:column;padding:22px}
.menuov.on{display:flex}
.menuov a{display:block;font-size:clamp(44px,9vw,96px);font-weight:800;text-transform:lowercase;letter-spacing:-.02em;color:#ECE4D4;text-decoration:none;padding:8px 0;cursor:pointer}
.menuov .mclose{align-self:flex-end;background:none;border:0;color:#ECE4D4;font-size:26px}
.menuov .mfoot{margin-top:auto;display:flex;gap:20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9A8F7A}
.menuov .mfoot a{font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:0}
.bcard{border:1px solid #2E2820;padding:18px;margin-bottom:14px;background:#221C15}
.bcard h3{font-size:17px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid #2E2820;vertical-align:top}
.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.adminnav button{border:1px solid #3A332A;background:#221C15;color:#ECE4D4;padding:9px 16px;font-weight:700;border-radius:0}
.adminnav button.on{background:#ECE4D4;color:#16130F}
.btn{background:#ECE4D4;color:#16130F;border:0;padding:14px 22px;font-weight:700;font-size:15px;border-radius:0}
.btnw{background:transparent;color:#ECE4D4;border:1px solid #3A332A;padding:12px 20px;font-weight:700;border-radius:0}
.mut{color:#9A8F7A;font-size:13px}
@media(max-width:760px){
.hdr .hidem{display:none}
.casehero{grid-template-columns:1fr}
.casehero .right{order:-1}
.casehero .right img{aspect-ratio:4/3;height:auto}
.pcard{flex:0 0 300px;height:210px}
.grid3{grid-template-columns:1fr 1fr}
.vals{grid-template-columns:1fr}
.next img{width:110px;height:74px;flex:0 0 110px}
}
</style>
</head>
<body>
<div id="intro"><span>forma</span></div>
<header class="hdr">
<span class="logo" onclick="go('inicio')">FORMA<small>MAPUTO</small></span>
<div class="hstack"><button class="hbtn" onclick="toggleMenu()">MENU</button><button class="hbtn hidem" onclick="go('contacto')">CONTACT</button></div>
<span class="sp"></span>
<div class="clock"><span id="localTime">--:--</span><small>LOCAL TIME</small></div>
<span class="dot"></span>
</header>
<div class="menuov" id="menuov"><button class="mclose" onclick="toggleMenu()">✕</button><a onclick="toggleMenu();go('inicio')">início</a><a onclick="toggleMenu();go('arquivo')">arquivo</a><a onclick="toggleMenu();go('sobre')">sobre</a><a onclick="toggleMenu();go('contacto')">contacto</a><a onclick="toggleMenu();go('conta')">conta</a><div class="mfoot"><a onclick="toggleMenu();go('admin')">gerência</a><a onclick="toggleMenu();waChat()">whatsapp</a></div></div>
<main>
<div id="v-inicio" class="view on"><div class="strip" id="strip"></div></div>
<div id="v-caso" class="view"><div id="caseBox"></div></div>
<div id="v-arquivo" class="view"><h1 style="font-size:clamp(40px,7vw,90px);font-weight:800;margin:20px 0">arquivo</h1><div class="grid3" id="grid3"></div></div>
<div id="v-sobre" class="view"><div id="aboutBox"></div></div>
<div id="v-contacto" class="view"><div class="contact"><h1>let's build together</h1><p class="sub">Conta-nos o teu projeto e respondemos em 48 horas.</p><div class="tabs"><button id="tabCliente" class="on" onclick="tabContacto('cliente')">Client</button><button id="tabTalento" onclick="tabContacto('talento')">Talent</button><button id="tabEmail" onclick="tabContacto('email')">Email</button></div><div id="briefBox"></div></div></div>
<div id="v-conta" class="view"><h1 style="font-size:clamp(40px,7vw,90px);font-weight:800;margin:20px 0">conta</h1><div id="accBox"></div></div>
<div id="v-admin" class="view"><h1 style="font-size:clamp(40px,7vw,90px);font-weight:800;margin:20px 0">gerência</h1><div class="adminnav" id="adminNav"></div><div id="adminBox"></div></div>
</main>
<script>
const IMG={
f1:'https://images.pexels.com/photos/24972993/pexels-photo-24972993/free-photo-of-studio-shot-of-model-in-dress.jpeg?auto=compress&w=1260&h=750&dpr=1',
f2:'https://images.pexels.com/photos/28251082/pexels-photo-28251082/free-photo-of-a-woman-with-white-hair-and-a-white-purse.jpeg?auto=compress&w=1260&h=750&dpr=1',
a1:'https://images.pexels.com/photos/37582309/pexels-photo-37582309/free-photo-of-modern-architectural-facade-with-lattice-design.jpeg?auto=compress&w=1260&h=750&dpr=1',
a2:'https://images.pexels.com/photos/36640787/pexels-photo-36640787/free-photo-of-curved-glass-architecture-in-manchester.png?auto=compress&w=1260&h=750&dpr=1',
i1:'https://images.pexels.com/photos/13722826/pexels-photo-13722826.jpeg?auto=compress&w=1260&h=750&dpr=1',
i2:'https://images.pexels.com/photos/14841129/pexels-photo-14841129.jpeg?auto=compress&w=1260&h=750&dpr=1',
m1:'https://images.pexels.com/photos/14110168/pexels-photo-14110168.jpeg?auto=compress&w=1260&h=750&dpr=1',
m2:'https://images.pexels.com/photos/39680454/pexels-photo-39680454/free-photo-of-black-armchair-in-studio-with-red-backdrop.jpeg?auto=compress&w=1260&h=750&dpr=1',
c1:'https://images.pexels.com/photos/36537445/pexels-photo-36537445/free-photo-of-portrait-of-woman-holding-cosmetic-product.jpeg?auto=compress&w=1260&h=750&dpr=1',
c2:'https://images.pexels.com/photos/31579771/pexels-photo-31579771/free-photo-of-close-up-portrait-of-woman-with-dark-skin.jpeg?auto=compress&w=1260&h=750&dpr=1'
};
function P(id,title,client,year,services,img,gal,intro){return{id,title,client,year,services,img,gal,intro}}
const PROJECTS_DEFAULT=[
P('editorial-noir','editorial noir','Editorial de moda',2025,'Direção criativa / Fotografia',IMG.f1,IMG.f2,'Uma série de estúdio a preto e branco sobre silhueta e atitude. A luz desenha o corpo, o resto desaparece.'),
P('fachada-viva','fachada viva','Arquitetura',2025,'Direção criativa / Fotografia de arquitetura',IMG.a1,IMG.a2,'O edifício como padrão. Olhar de baixo para cima, onde a fachada vira desenho.'),
P('lounge-escuro','lounge escuro','Interiores',2024,'Direção criativa / Design de interiores',IMG.i1,IMG.i2,'Interiores que se vivem à noite. Luz quente, curvas suaves e sombra como material.'),
P('poltrona-chesterfield','poltrona chesterfield','Mobiliário',2025,'Design de produto / Fotografia',IMG.m1,IMG.m2,'Um clássico fotografado como objeto de desejo. Couro, botão e sombra, sem ruído.'),
P('beleza-em-close','beleza em close','Campanha de beleza',2024,'Direção criativa / Fotografia de beleza',IMG.c1,IMG.c2,'A beleza a centímetros de distância. Pele, luz e cor, sem retoque que apague a pessoa.')
];
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let PROJECTS=load('forma_projects',PROJECTS_DEFAULT);
let ACCOUNTS=load('forma_accounts',[]);
let SESSION=load('forma_session',null);
let SETTINGS=load('forma_settings',{whatsapp:'258840000000',email:'ola@forma.co.mz'});
let ABOUT=load('forma_about',{intro:'A FORMA é um estúdio criativo de Maputo. Trabalhamos imagem, marca e espaço para clientes que querem ser lembrados — não apenas vistos.',vals:[['empatia','Antes de desenhar, ouvimos. O trabalho começa na pessoa, não no briefing.'],['liberdade','Sem fórmulas. Cada projeto encontra a sua própria forma.'],['crescimento','O estúdio cresce com os clientes, projeto a projeto.']]});
let CURCASE=null, ADMIN_TAB='projetos', CTAB='cliente', EDIT_P=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function me(){return SESSION?ACCOUNTS.find(a=>a.email===SESSION):null}
function isAdmin(){const m=me();return m&&m.is_admin}
function toggleMenu(){$('menuov').classList.toggle('on')}
function tickClock(){try{$('localTime').textContent=new Intl.DateTimeFormat('pt-MZ',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Maputo'}).format(new Date())}catch(e){}}
function waChat(){window.open('https://wa.me/'+SETTINGS.whatsapp.replace(/\D/g,''),'_blank')}
function renderHome(){$('strip').innerHTML=PROJECTS.map(p=>`<button class="pcard" onclick="openCase('${p.id}')"><img src="${p.img}" alt=""><span>${esc(p.title)}<small>${esc(p.client)} · ${p.year}</small></span></button>`).join('')}
function openCase(id){CURCASE=id;go('caso')}
function renderCase(){
const p=PROJECTS.find(x=>x.id===CURCASE);if(!p){go('inicio');return}
const idx=PROJECTS.findIndex(x=>x.id===p.id);
const nx=PROJECTS[(idx+1)%PROJECTS.length];
$('caseBox').innerHTML=`<div class="casehero"><div class="left"><span class="tag">FORMA — Estúdio criativo</span><h1>${esc(p.title)}</h1><div class="meta"><span>${esc(p.client)} / ${p.year}</span><span>${esc(p.services)}</span></div></div><div class="right"><img src="${p.img}"></div></div>
<p class="intro">${esc(p.intro)}</p>
<div class="numsec"><div class="lab">01. direção de arte</div><img src="${p.gal}"></div>
<div class="numsec"><div class="lab">02. imagem</div><img src="${p.img}"></div>
<div class="next" onclick="openCase('${nx.id}')"><h2>next project<br>${esc(nx.title)}</h2><img src="${nx.img}"></div>`;
}
function renderArquivo(){$('grid3').innerHTML=PROJECTS.map(p=>`<button onclick="openCase('${p.id}')"><img src="${p.img}"></button><button onclick="openCase('${p.id}')"><img src="${p.gal}"></button>`).join('')}
function renderSobre(){
$('aboutBox').innerHTML=`<h1>sobre</h1><p style="font-size:20px;line-height:1.5;max-width:800px">${esc(ABOUT.intro)}</p>
<div class="vals">${ABOUT.vals.map((v,i)=>`<div><b>0${i+1}. ${esc(v[0])}</b><p>${esc(v[1])}</p></div>`).join('')}</div>
<h2 style="font-size:30px;margin:20px 0">processo</h2>
<div class="steps">${[['ver','Olhamos para o problema com calma, antes de qualquer ideia.'],['explorar','Caminhos abertos, referências e testes, sem pressa de fechar.'],['moldar','Definimos tom, história e lógica visual do projeto.'],['criar','A ideia ganha forma final, com rigor em cada detalhe.'],['refinar','Ajustamos até o trabalho ficar exato.'],['evoluir','O projeto continua a crescer depois da entrega.']].map((s,i)=>`<div><b>0${i+1}</b><p><b style="color:#ECE4D4">${s[0]}</b> — ${s[1]}</p></div>`).join('')}</div>`;
}
function tabContacto(t){CTAB=t;['Cliente','Talento','Email'].forEach(n=>$('tab'+n).classList.toggle('on',n.toLowerCase()===t));renderBrief()}
function renderBrief(){
if(CTAB==='email'){$('briefBox').innerHTML=`<p style="font-size:18px;line-height:1.6">Escreve-nos para <b>${esc(SETTINGS.email)}</b> ou fala connosco já no WhatsApp.</p><button class="send" onclick="waChat()">WhatsApp →</button>`;return}
if(CTAB==='talento'){$('briefBox').innerHTML=`<p style="font-size:18px;line-height:1.6;margin-bottom:10px">Junta-te à nossa rede de talento.</p>
<label>01. Área</label><div class="chks">${['Design gráfico','Fotografia','Vídeo','Ilustração','Design de interiores','Produção'].map(s=>`<label><input type="checkbox"> ${s}</label>`).join('')}</div>
<label>02. Nível</label><div class="chks">${['Júnior','Intermédio','Sénior','Diretor'].map(s=>`<label><input type="radio" name="lvl"> ${s}</label>`).join('')}</div>
<label>03. Nome</label><input id="bName"><label>04. Email</label><input id="bEmail" type="email"><label>05. Portfólio (link)</label><input id="bPort"><label>06. Cidade</label><input id="bCity">
<button class="send" onclick="submitBrief()">Send →</button><div id="briefOk"></div>`;return}
$('briefBox').innerHTML=`<label>01. Âmbito</label><div class="chks">${['Direção criativa','Design de marca','Design digital e UI','Fotografia','Vídeo e motion','Campanhas','Design de interiores','Não sei ainda'].map(s=>`<label><input type="checkbox"> ${s}</label>`).join('')}</div>
<label>02. Formato</label><div class="chks">${['Projeto','Freelance','Avença'].map(s=>`<label><input type="radio" name="fmt"> ${s}</label>`).join('')}</div>
<label>03. Orçamento</label><div class="chks">${['50.000–100.000 MT','100.000–200.000 MT','200.000–500.000 MT','500.000+ MT','Vamos conversar primeiro'].map(s=>`<label><input type="radio" name="bud"> ${s}</label>`).join('')}</div>
<label>04. Nome *</label><input id="bName"><label>05. Email *</label><input id="bEmail" type="email"><label>06. Empresa</label><input id="bCompany"><label>07. Prazo</label><input id="bTime"><label>08. Nota</label><textarea id="bNote"></textarea>
<button class="send" onclick="submitBrief()">Send →</button><div id="briefOk"></div>`;
}
function submitBrief(){const n=$('bName')&&$('bName').value.trim(),e=$('bEmail')&&$('bEmail').value.trim();if(!n||!e||!e.includes('@')){alert('Escreve o nome e um email válido.');return}$('briefOk').innerHTML='<p style="margin-top:16px;font-weight:700">Obrigado! Respondemos em 48 horas.</p><button class="send" onclick="waChat()">Ou fala já no WhatsApp →</button>';}
function renderConta(){
const m=me();
if(!m){$('accBox').innerHTML=`<div style="max-width:420px"><label style="display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Email</label><input id="aEmail" type="email" style="margin-bottom:12px"><label style="display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Palavra-passe</label><input id="aPass" type="password" style="margin-bottom:12px"><label style="display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px">Nome</label><input id="aName" placeholder="só no registo" style="margin-bottom:16px"><button class="btn" onclick="loginSubmit()">Entrar</button> <button class="btnw" onclick="regSubmit()">Criar conta</button><p class="mut" style="margin-top:12px">A primeira conta criada é a da gerência.</p></div>`;return}
$('accBox').innerHTML=`<div class="bcard"><b>${esc(m.name||m.email)}</b><div class="mut">${esc(m.email)}</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${m.is_admin?`<button class="btn" onclick="go('admin')">Gerência</button>`:''}<button class="btnw" onclick="logout()">Sair</button></div></div>`;
}
async function loginSubmit(){const e=$('aEmail').value.trim().toLowerCase(),p=$('aPass').value;const a=ACCOUNTS.find(x=>x.email===e);if(!a||a.pass!==await sha(p)){alert('Email ou palavra-passe errados.');return}SESSION=e;save('forma_session',SESSION);go('inicio')}
async function regSubmit(){const e=$('aEmail').value.trim().toLowerCase(),p=$('aPass').value,n=$('aName').value.trim();if(!e.includes('@')||p.length<4){alert('Escreve um email válido e uma palavra-passe com 4 ou mais caracteres.');return}if(ACCOUNTS.find(x=>x.email===e)){alert('Já existe uma conta com esse email. Entra em vez disso.');return}ACCOUNTS.push({email:e,pass:await sha(p),name:n||e,is_admin:ACCOUNTS.length===0});save('forma_accounts',ACCOUNTS);SESSION=e;save('forma_session',SESSION);go('inicio')}
function logout(){SESSION=null;save('forma_session',SESSION);go('inicio')}

function adminNavRender(){$('adminNav').innerHTML=[['projetos','Projetos'],['sobre','Sobre'],['definicoes','Definições']].map(t=>`<button class="${ADMIN_TAB===t[0]?'on':''}" onclick="adminTab('${t[0]}')">${t[1]}</button>`).join('')}
function adminTab(t){ADMIN_TAB=t;renderAdmin()}
function renderAdmin(){
if(!isAdmin()){$('adminBox').innerHTML='<p class="mut">Área reservada à gerência.</p>';return}
adminNavRender();
if(ADMIN_TAB==='projetos'){
$('adminBox').innerHTML=`<table><tr><th>Projeto</th><th>Cliente</th><th>Ano</th><th></th></tr>${PROJECTS.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.client)}</td><td>${p.year}</td><td><button onclick="projEdit('${p.id}')">Editar</button> <button onclick="projDel('${p.id}')">Apagar</button></td></tr>`).join('')}</table>
<div class="bcard" style="margin-top:16px"><b id="projFormTitle">Novo projeto</b><div style="display:grid;gap:10px;margin-top:12px"><input id="fPTitle" placeholder="Título em minúsculas"><input id="fPClient" placeholder="Cliente"><input id="fPYear" type="number" placeholder="Ano"><input id="fPServ" placeholder="Serviços"><textarea id="fPIntro" placeholder="Texto de introdução"></textarea><label>Foto principal (por ficheiro)</label><input type="file" id="fPPhoto" accept="image/*" onchange="projPhoto(this,'main')"><input type="hidden" id="fPImg"><label>Foto da galeria (por ficheiro)</label><input type="file" id="fPGPhoto" accept="image/*" onchange="projPhoto(this,'gal')"><input type="hidden" id="fPGal"><button class="btn" onclick="projSave()">Guardar projeto</button></div></div>`;
}else if(ADMIN_TAB==='sobre'){
$('adminBox').innerHTML=`<div class="bcard" style="display:grid;gap:10px;max-width:640px"><b>Sobre o estúdio</b><label>Introdução</label><textarea id="fAbout">${esc(ABOUT.intro)}</textarea><button class="btn" onclick="saveAbout()">Guardar</button></div>`;
}else{
$('adminBox').innerHTML=`<div class="bcard" style="display:grid;gap:10px;max-width:520px"><b>Definições</b><label>WhatsApp (ex: 25884…)</label><input id="fWa" value="${esc(SETTINGS.whatsapp)}"><label>Email de contacto</label><input id="fEmail" value="${esc(SETTINGS.email)}"><button class="btn" onclick="saveSettings()">Guardar definições</button></div>`;
}
}
function projPhoto(inp,which){const f=inp.files[0];if(!f)return;if(f.size>10*1024*1024){alert('A foto deve ter até 10 MB.');return}const r=new FileReader();r.onload=()=>{$(which==='main'?'fPImg':'fPGal').value=r.result;alert('Foto carregada. Guarda o projeto para aplicar.');};r.readAsDataURL(f)}
function projEdit(id){const p=PROJECTS.find(x=>x.id===id);if(!p)return;EDIT_P=id;renderAdmin();$('projFormTitle').textContent='Editar projeto';$('fPTitle').value=p.title;$('fPClient').value=p.client;$('fPYear').value=p.year;$('fPServ').value=p.services;$('fPIntro').value=p.intro;$('fPImg').value=p.img;$('fPGal').value=p.gal;window.scrollTo(0,document.body.scrollHeight)}
function projSave(){const title=$('fPTitle').value.trim().toLowerCase(),client=$('fPClient').value.trim(),year=+($('fPYear').value)||new Date().getFullYear(),serv=$('fPServ').value.trim(),intro=$('fPIntro').value.trim(),img=$('fPImg').value,gal=$('fPGal').value;if(!title){alert('Escreve o título do projeto.');return}if(EDIT_P){const p=PROJECTS.find(x=>x.id===EDIT_P);Object.assign(p,{title,client:client||p.client,year,services:serv||p.services,intro:intro||p.intro,img:img||p.img,gal:gal||p.gal});}else{PROJECTS.push(P('p'+Date.now(),title,client||'Projeto',year,serv||'Direção criativa',img||IMG.f1,gal||IMG.f2,intro||title));}EDIT_P=null;save('forma_projects',PROJECTS);renderHome();renderAdmin();alert('Projeto guardado.')}
function projDel(id){if(!confirm('Apagar este projeto?'))return;PROJECTS=PROJECTS.filter(p=>p.id!==id);save('forma_projects',PROJECTS);renderHome();renderAdmin()}
function saveAbout(){ABOUT.intro=$('fAbout').value.trim();save('forma_about',ABOUT);alert('Texto guardado.')}
function saveSettings(){SETTINGS.whatsapp=$('fWa').value.trim();SETTINGS.email=$('fEmail').value.trim();save('forma_settings',SETTINGS);alert('Definições guardadas.')}
function go(v){
document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
const el=$('v-'+v);if(el)el.classList.add('on');
if(v==='inicio')renderHome();
if(v==='caso')renderCase();
if(v==='arquivo')renderArquivo();
if(v==='sobre')renderSobre();
if(v==='contacto'){tabContacto(CTAB)}
if(v==='conta')renderConta();
if(v==='admin')renderAdmin();
window.scrollTo(0,0);
}
function route(){const h=(location.hash||'#inicio').replace('#','');const parts=h.split('/');if(parts[0]==='caso'&&parts[1]){CURCASE=parts[1];go('caso')}else if(['inicio','arquivo','sobre','contacto','conta','admin'].includes(parts[0]))go(parts[0]);else go('inicio')}
window.addEventListener('hashchange',route);
tickClock();setInterval(tickClock,30000);
route();renderHome();
</script>
</body>
</html>
